name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # 3.9 is the floor the skill claims, so it is the version CI proves.
          # Testing only on a newer interpreter would let a 3.10-only construct
          # ship against a README that promises 3.9.
          python-version: "3.9"
      - name: tests
        # Standard library only, no network and no account - which is the whole
        # reason this can run on every push.
        run: cd skills/pennyblack && python3 -m unittest discover -s tests

      - name: shell scripts parse
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills -name '*.sh'; })
          exit $fail

      - name: plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: no em dashes
        run: |
          if grep -rInP '[\x{2014}\x{2013}]' --include='*.md' --include='*.py' .; then
            echo "em or en dash found"; exit 1
          fi

      - name: draft and send stay separate commands
        # THE ONE CONSTRAINT THIS SKILL CANNOT LOSE. Physical post cannot be
        # recalled once printed and every send costs money, so there is deliberately no
        # command that writes and posts in one go. TestDraftSendRail in
        # tests/test_cli.py asserts it at the command line, including the exact
        # set of subcommands; this is a cheap second check on the function names.
        run: |
          if grep -rInE 'def (cmd_)?(draft_and_send|send_now|post_now|oneshot)' \
               --include='*.py' skills/pennyblack/scripts; then
            echo "a one-shot draft-and-send command has appeared"; exit 1
          fi

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"

      - name: ruff - syntax errors and undefined names
        run: |
          pip install --quiet ruff
          ruff check . --select E9,F --exclude .venv
